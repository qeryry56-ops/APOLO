  <script>
    // Ensure dynamically created camera <video> elements play inline on iOS Safari / PWA
    (function() {
      var origCreateElement = document.createElement.bind(document);
      document.createElement = function(tagName, options) {
        var el = origCreateElement(tagName, options);
        if (typeof tagName === 'string' && tagName.toLowerCase() === 'video') {
          el.setAttribute('playsinline', 'true');
          el.setAttribute('webkit-playsinline', 'true');
          el.playsInline = true;
          el.muted = true;
          el.autoplay = true;
        }
        return el;
      };

      var jsQrPromise = null;
      function loadJsQr() {
        if (window.jsQR) return Promise.resolve(true);
        if (jsQrPromise) return jsQrPromise;
        jsQrPromise = new Promise(function(resolve) {
          var s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js';
          s.async = true;
          s.onload = function() { resolve(!!window.jsQR); };
          s.onerror = function() { jsQrPromise = null; resolve(false); };
          document.head.appendChild(s);
          setTimeout(function() { resolve(!!window.jsQR); }, 6000);
        });
        return jsQrPromise;
      }

      async function detectNative(source) {
        if (!('BarcodeDetector' in window)) return '';
        try {
          var det = new window.BarcodeDetector({ formats: ['qr_code'] });
          var list = await det.detect(source);
          for (var i = 0; i < list.length; i++) {
            var val = (list[i].rawValue || '').trim();
            if (val) return val;
          }
        } catch (_) {}
        return '';
      }

      function decodeSourceWithJsQr(source, srcW, srcH) {
        if (!window.jsQR || srcW <= 0 || srcH <= 0) return '';
        var dims = [1200, 720, 1800];
        for (var i = 0; i < dims.length; i++) {
          try {
            var maxD = dims[i];
            var scale = (srcW > maxD || srcH > maxD)
              ? (maxD / Math.max(srcW, srcH))
              : 1;
            var w = Math.max(1, Math.round(srcW * scale));
            var h = Math.max(1, Math.round(srcH * scale));
            var c = document.createElement('canvas');
            c.width = w;
            c.height = h;
            var ctx = c.getContext('2d', { willReadFrequently: true });
            if (!ctx) continue;
            ctx.drawImage(source, 0, 0, w, h);
            var imgData = ctx.getImageData(0, 0, w, h);
            var res = window.jsQR(imgData.data, w, h, { inversionAttempts: 'attemptBoth' });
            if (res && res.data && res.data.trim()) return res.data.trim();
          } catch (_) {}
        }
        return '';
      }

      var activeStream = null;
      var activeVideo = null;
      var scanTimer = null;
      var scanCanvas = null;
      var scanCtx = null;
      var scanBusy = false;

      function stopCameraInternal() {
        if (scanTimer) {
          clearInterval(scanTimer);
          scanTimer = null;
        }
        scanBusy = false;
        if (activeStream) {
          try {
            var tracks = activeStream.getTracks();
            for (var i = 0; i < tracks.length; i++) {
              tracks[i].stop();
            }
          } catch (_) {}
          activeStream = null;
        }
        if (activeVideo) {
          try {
            activeVideo.pause();
            activeVideo.srcObject = null;
          } catch (_) {}
          activeVideo = null;
        }
      }

      function findActiveVideo() {
        if (activeVideo && activeVideo.videoWidth > 0 && activeVideo.videoHeight > 0) {
          return activeVideo;
        }
        var vids = document.querySelectorAll('video');
        for (var i = vids.length - 1; i >= 0; i--) {
          if (vids[i].videoWidth > 0 && vids[i].videoHeight > 0) return vids[i];
        }
        return null;
      }

      window.ApoloQr = {
        mountCameraView: function(viewId, onDetect, onStatus) {
          stopCameraInternal();
          loadJsQr();

          var wrap = document.createElement('div');
          wrap.setAttribute('dir', 'ltr');
          wrap.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;overflow:hidden;background:#000000;direction:ltr;';

          var vid = document.createElement('video');
          vid.setAttribute('playsinline', 'true');
          vid.setAttribute('webkit-playsinline', 'true');
          vid.setAttribute('autoplay', 'true');
          vid.setAttribute('muted', 'true');
          vid.playsInline = true;
          vid.muted = true;
          vid.autoplay = true;
          vid.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;display:block;pointer-events:none;';
          wrap.appendChild(vid);
          activeVideo = vid;

          (async function() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
              if (onStatus) onStatus('error:unsupported');
              return;
            }
            var stream = null;
            try {
              stream = await navigator.mediaDevices.getUserMedia({
                audio: false,
                video: {
                  facingMode: { ideal: 'environment' },
                  width: { ideal: 1280 },
                  height: { ideal: 720 }
                }
              });
            } catch (_) {
              try {
                stream = await navigator.mediaDevices.getUserMedia({
                  audio: false,
                  video: true
                });
              } catch (err2) {
                if (onStatus) onStatus('error:' + ((err2 && err2.name) || 'denied'));
                return;
              }
            }

            if (activeVideo !== vid) {
              try {
                stream.getTracks().forEach(function(t) { t.stop(); });
              } catch (_) {}
              return;
            }

            activeStream = stream;
            vid.onloadedmetadata = function() {
              try { vid.play(); } catch (_) {}
            };
            vid.srcObject = stream;
            try {
              await vid.play();
            } catch (_) {}
            if (onStatus) onStatus('streaming');

            if (!scanCanvas) {
              scanCanvas = document.createElement('canvas');
              scanCtx = scanCanvas.getContext('2d', { willReadFrequently: true });
            }

            scanTimer = setInterval(async function() {
              if (scanBusy || !activeVideo || activeVideo.videoWidth <= 0 || activeVideo.videoHeight <= 0) {
                return;
              }
              scanBusy = true;
              try {
                var hit = await detectNative(activeVideo);
                if (hit) {
                  if (onDetect) onDetect(hit);
                  return;
                }
                if (window.jsQR && scanCanvas && scanCtx) {
                  var vw = activeVideo.videoWidth;
                  var vh = activeVideo.videoHeight;
                  var maxD = 640;
                  var sc = (vw > maxD || vh > maxD) ? (maxD / Math.max(vw, vh)) : 1;
                  var cw = Math.max(1, Math.round(vw * sc));
                  var ch = Math.max(1, Math.round(vh * sc));
                  if (scanCanvas.width !== cw || scanCanvas.height !== ch) {
                    scanCanvas.width = cw;
                    scanCanvas.height = ch;
                  }
                  scanCtx.drawImage(activeVideo, 0, 0, cw, ch);
                  var data = scanCtx.getImageData(0, 0, cw, ch);
                  var res = window.jsQR(data.data, cw, ch, { inversionAttempts: 'attemptBoth' });
                  if (res && res.data && res.data.trim()) {
                    if (onDetect) onDetect(res.data.trim());
                  }
                }
              } catch (_) {
              } finally {
                scanBusy = false;
              }
            }, 220);
          })();

          return wrap;
        },
        stopCameraView: function() {
          stopCameraInternal();
        },
        decodeBase64: async function(b64) {
          try {
            var bin = atob(b64);
            var arr = new Uint8Array(bin.length);
            for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
            var url = URL.createObjectURL(new Blob([arr]));
            try {
              var img = new Image();
              var ok = await new Promise(function(resolve) {
                img.onload = function() { resolve(true); };
                img.onerror = function() { resolve(false); };
                img.src = url;
              });
              if (!ok || !img.naturalWidth) return '';
              var hit = await detectNative(img);
              if (hit) return hit;
              if (await loadJsQr()) {
                return decodeSourceWithJsQr(img, img.naturalWidth, img.naturalHeight);
              }
            } finally {
              URL.revokeObjectURL(url);
            }
          } catch (_) {}
          return '';
        },
        captureVideoFrame: async function() {
          var v = findActiveVideo();
          if (!v) return '';
          var hit = await detectNative(v);
          if (hit) return hit;
          if (await loadJsQr()) {
            return decodeSourceWithJsQr(v, v.videoWidth, v.videoHeight);
          }
          return '';
        },
        toggleTorch: async function(currentState) {
          try {
            var v = findActiveVideo();
            if (!v || !v.srcObject || !v.srcObject.getVideoTracks) return '';
            var tracks = v.srcObject.getVideoTracks();
            if (!tracks.length) return '';
            var track = tracks[0];
            var caps = track.getCapabilities ? track.getCapabilities() : {};
            if (!caps || !caps.torch) return '';
            var next = !currentState;
            await track.applyConstraints({ advanced: [{ torch: next }] });
            return next ? 'on' : 'off';
          } catch (_) {
            return '';
          }
        },
        clearDeepLinkPath: function() {
          try {
            if ((location.pathname && location.pathname !== '/') || location.search) {
              history.replaceState(null, '', '/');
            }
          } catch (_) {}
        }
      };
    })();
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }
    window.addEventListener('flutter-first-frame', function() {
      var splash = document.getElementById('apolo-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function() { splash.remove(); }, 460);
      }
    });
  </script>
