name: apolo_mobile
description: Apolo.ma - المغربية للإعلانات المبوبة والمتاجر الإلكترونية
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.4.3+1
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  share_plus: ^9.0.0
  intl: ^0.20.2
  in_app_purchase: ^3.2.0
  device_preview: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/hero_car.png
    - assets/images/cat_realestate.png
    - assets/images/cat_phones.png
    - assets/images/cat_computers.png
    - assets/images/cat_home.png
    - assets/images/cat_fashion.png
    - assets/images/cat_jobs.png
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 800
