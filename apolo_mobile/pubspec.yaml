name: apolo_mobile
description: Apolo.ma - المغربية للإعلانات المبوبة والمتاجر الإلكترونية
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.4.3+1
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  share_plus: ^10.0.0
  intl: ^0.20.2
  in_app_purchase: ^3.2.0
  device_preview: ^1.2.0
  firebase_core: ^3.4.0
  cloud_firestore: ^5.4.0
  sensors_plus: ^7.1.1
  pinput: ^5.0.0
  smart_auth: ^3.2.0
  audio_waveforms: ^2.0.2
  path_provider: ^2.1.4
  qr: ^3.0.2
  mobile_scanner: ^7.0.0
  livekit_client: ^2.14.0
  permission_handler: ^13.0.2
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/hero_car.png
    - assets/images/cat_realestate.png
    - assets/images/cat_phones.png
    - assets/images/cat_computers.png
    - assets/images/cat_home.png
    - assets/images/cat_fashion.png
    - assets/images/cat_jobs.png
    - assets/images/cat_travel.png
    - assets/images/cat_parapharmacy.png
    - assets/images/cat_kids.png
    - assets/images/cat_bricolage.png
    - assets/images/cat_industrial.png
    - assets/images/cat_jewelry.png
    - assets/images/cat_antique.png
    - assets/images/cat_other.png
    - assets/images/apolo_icon_white.png
    - assets/images/apolo_logo_white.png
    - assets/images/apolo_logo_white_transparent.png
    - assets/images/state_no_internet.png
    - assets/images/state_notifications.png
    - assets/images/auth_hero_3d.png
    - assets/images/state_empty_ads.png
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 800
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 600
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
