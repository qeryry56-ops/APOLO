name: Apolo.ma CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-tests:
    name: 1. Flutter Analyze & Unit/Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apolo_mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Run Flutter unit & integration tests
        run: flutter test --reporter expanded

  vitest-unit-integration:
    name: 2. Node/Vitest Unit & SQLite Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24 (native node:sqlite)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Node test dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Unit tests
        run: npm run test:unit

      - name: Run API <-> SQLite Integration tests
        run: npm run test:integration

  playwright-e2e:
    name: 3. Playwright End-to-End Browser Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Node test dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Playwright Chromium & OS deps
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run test:e2e

      - name: Upload Playwright screenshots/traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: test-results/
          retention-days: 7

  k6-performance:
    name: 4. k6 Load & Performance Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Start isolated Apolo test server & run k6
        run: |
          APOLO_TEST_HOST=127.0.0.1 APOLO_TEST_PORT=8788 node tests/server/start_server.mjs &
          SERVER_PID=$!
          trap "kill $SERVER_PID || true" EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8788/api/v1/taxonomy >/dev/null; then
              break
            fi
            sleep 1
          done
          APOLO_BASE_URL=http://127.0.0.1:8788 k6 run --summary-export=tests/performance/k6_summary.json tests/performance/k6_load_test.js

      - name: Upload k6 performance summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-performance-summary
          path: tests/performance/k6_summary.json
          retention-days: 14

  deploy:
    name: 5. Production Deploy to Vercel (Gated on All Tests Passing)
    runs-on: ubuntu-latest
    needs: [flutter-tests, vitest-unit-integration, playwright-e2e, k6-performance]
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && success() }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build verified Flutter Web release bundle
        working-directory: apolo_mobile
        run: |
          flutter pub get
          flutter build web --release

      - name: Deploy apolo_mobile/build/web to Vercel Production
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"

      - name: Deployment guard check when Vercel secrets are not configured
        if: ${{ secrets.VERCEL_TOKEN == '' }}
        run: |
          echo "All test suites passed. Add VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID in GitHub Repository Secrets to enable automatic Vercel push."
